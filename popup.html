<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo-wrapper">
      <div class="logo">ن</div>
      <div class="title-group">
        <h1>نیم‌فاصله‌یار</h1>
        <p class="subtitle">اصلاح نیم‌فاصله، حروف و نشانه‌های متن فارسی</p>
      </div>
    </div>
    <button id="themeBtn" class="icon-btn" title="حالت تیره/روشن" aria-label="تغییر حالت تیره و روشن">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <textarea id="input" placeholder="متن فارسی را اینجا بنویسید یا بچسبانید…" rows="4"></textarea>
    <div class="meta">
      <span id="charCount"></span>
      <span class="hint">اصلاح زنده است — Ctrl+Enter: اصلاح و کپی</span>
    </div>

    <button id="fixBtn">اصلاح متن</button>

    <textarea id="output" readonly placeholder="متن اصلاح‌شده اینجا نمایش داده می‌شود" rows="4"></textarea>

    <div class="row">
      <button id="copyBtn">کپی</button>
      <button id="clearBtn">پاک کردن</button>
    </div>

    <fieldset class="card">
      <legend>دسته‌های اصلاح</legend>
      <label class="toggle">
        <input type="checkbox" id="opt-arabicChars">
        <span class="switch"></span>
        <span class="toggle-text">حروف عربی (ي ك ة)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-digits">
        <span class="switch"></span>
        <span class="toggle-text">اعداد عربی (٠١٢)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-halfSpace">
        <span class="switch"></span>
        <span class="toggle-text">نیم‌فاصله (می‌شود، کتاب‌ها)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-punctuation">
        <span class="switch"></span>
        <span class="toggle-text">نشانه‌گذاری و فاصله‌ها</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-latinDigits">
        <span class="switch"></span>
        <span class="toggle-text">اعداد لاتین (123)</span>
      </label>
    </fieldset>

    <div id="stats" class="stats">هنوز متنی اصلاح نشده است</div>
  </main>

  <footer>
    <p class="note">۱۰۰٪ لوکال — هیچ متنی از مرورگر شما خارج نمی‌شود.</p>
  </footer>

  <script src="fixer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
